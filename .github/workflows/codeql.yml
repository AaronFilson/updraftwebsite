name: CodeQL

# GitHub's code scanning for the site, backend and scripts (JavaScript). Findings show under the
# repository's Security tab and on pull requests. Free for public repositories.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly, so new queries run against unchanged code too

permissions: {}

jobs:
  analyze:
    name: JavaScript
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
