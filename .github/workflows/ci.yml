name: CI

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository; nothing here needs to write.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix backend

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Check for known vulnerabilities
        run: |
          npm audit --audit-level=high
          npm audit --audit-level=high --prefix backend

      - name: Unit tests (site and API)
        run: npm test

      - name: Build site
        run: npm run build
        env:
          SITE_URL: https://updraftpotterystudio.com

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run test:e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
