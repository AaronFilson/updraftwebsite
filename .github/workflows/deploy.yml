name: Deploy

# Deploys the API and publishes the site for one stage, from a commit that passed CI. No stored AWS
# keys: GitHub signs in to AWS with OIDC and assumes updraft-github-deploy, which has the same
# updraft-* permissions as the deploy user (deploy/copper-bell-publish-policy.json).
#
# Setup (once): deploy/README.md, "One-time admin setup", step 3.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Which stage to deploy
        required: true
        type: choice
        options: [staging, prod]
        default: staging

permissions: {}

concurrency:
  group: deploy-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  deploy:
    # Named, not ubuntu-latest, so the OS (fonts, browser packages) only changes in a commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ inputs.stage == 'prod' && 'production' || 'staging' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix backend

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy API and CloudFront routing
        run: npm run deploy:api -- --stage ${{ inputs.stage }}

      - name: Publish the site
        run: npm run publish -- --stage ${{ inputs.stage }}
