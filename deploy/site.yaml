AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Updraft Pottery Studio static site: private S3 bucket behind CloudFront (Origin Access Control),
  HTTPS for the apex and www, security headers, and an optional /api/* route to the Lambda API.
  The domain's A records are switched to CloudFront separately (see deploy/README.md), so this
  stack can be created and tested on its cloudfront.net address first.

Parameters:
  DomainName: { Type: String, Default: updraftpotterystudio.com }
  HostedZoneId: { Type: String, Default: Z88UBBDI22ZJ9, Description: Route 53 zone for DomainName (used for certificate validation) }
  ApiDomain:
    Type: String
    Default: ""
    Description: Host of the Lambda Function URL (e.g. abc123.lambda-url.us-east-1.on.aws). Empty = no /api route yet.
  CheckoutDomain:
    Type: String
    Default: ""
    Description: Host of the checkout Function URL (one order at a time). Empty = /api/checkout goes to ApiDomain.

Conditions:
  HasApi: !Not [!Equals [!Ref ApiDomain, ""]]
  HasCheckout: !Not [!Equals [!Ref CheckoutDomain, ""]]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub updraft-site-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket lets S3 answer 404 (not 403) for missing pages, so CloudFront can show error.html.
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZoneId }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub updraft-site-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: updraft-site-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          # Styles are inlined into each page, and Square's card form needs its own hosts.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              img-src 'self' data: https://*.squarecdn.com https://items-images-production.s3.us-west-2.amazonaws.com https://items-images-sandbox.s3.us-west-2.amazonaws.com;
              script-src 'self' https://*.squarecdn.com https://js.squareup.com https://js.squareupsandbox.com;
              style-src 'self' 'unsafe-inline' https://*.squarecdn.com;
              font-src 'self' https://*.squarecdn.com https://d1g145x70srn7h.cloudfront.net;
              connect-src 'self' https://*.squareup.com https://*.squareupsandbox.com https://*.squarecdn.com https://o160250.ingest.sentry.io;
              frame-src https://*.squarecdn.com https://*.squareup.com https://*.squareupsandbox.com https://*.cardinalcommerce.com;
              base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${DomainName} static site
        Enabled: true
        Aliases: [!Ref DomainName, !Sub "www.${DomainName}"]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - !If
            - HasApi
            - Id: api
              DomainName: !Ref ApiDomain
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            - !Ref AWS::NoValue
          - !If
            - HasCheckout
            - Id: checkout
              DomainName: !Ref CheckoutDomain
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # Order matters: CloudFront uses the first matching pattern, so /api/checkout comes before /api/*.
        CacheBehaviors:
          - !If
            - HasCheckout
            - PathPattern: /api/checkout
              TargetOriginId: checkout
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
          - !If
            - HasApi
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /error.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /error.html, ErrorCachingMinTTL: 60 }

Outputs:
  BucketName: { Value: !Ref SiteBucket }
  DistributionId: { Value: !Ref Distribution }
  DistributionDomain: { Value: !GetAtt Distribution.DomainName }
  CertificateArn: { Value: !Ref Certificate }
