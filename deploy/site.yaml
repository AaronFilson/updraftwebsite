AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Updraft Pottery Studio static site, one stack per stage (updraft-site, updraft-staging-site): private
  S3 bucket behind CloudFront (origin access control), HTTPS, security headers, and /api routes to the
  Lambda functions, which only CloudFront can call (origin access control of type lambda). Production
  DNS is switched by scripts/dns-cutover.mjs; staging's record is part of this stack (ManageDns).

Parameters:
  DomainName: { Type: String, Default: updraftpotterystudio.com }
  HostedZoneId: { Type: String, Default: Z88UBBDI22ZJ9, Description: Route 53 zone for DomainName (used for certificate validation) }
  ApiDomain:
    Type: String
    Default: ""
    Description: Host of the Lambda Function URL (e.g. abc123.lambda-url.us-east-1.on.aws). Empty = no /api route yet.
  CheckoutDomain:
    Type: String
    Default: ""
    Description: Host of the checkout Function URL (one order at a time). Empty = /api/checkout goes to ApiDomain.
  ApiFunctionName: { Type: String, Default: "", Description: "Catalog/quote/signup function; set to let only this distribution call it" }
  CheckoutFunctionName: { Type: String, Default: "", Description: "Checkout function; set to let only this distribution call it" }
  ImagesDomain: { Type: String, Default: "", Description: "Host of the photo-resizing Function URL. Empty = no /api/img route." }
  ImagesFunctionName: { Type: String, Default: "", Description: "Photo-resizing function; set to let only this distribution call it" }
  NameSuffix: { Type: String, Default: "", Description: "Empty for production (keeps existing names), e.g. -staging otherwise" }
  IncludeWww: { Type: String, Default: "true", AllowedValues: ["true", "false"] }
  ManageDns: { Type: String, Default: "false", AllowedValues: ["true", "false"], Description: "Create the A/AAAA alias records here (staging)" }

Conditions:
  HasApi: !Not [!Equals [!Ref ApiDomain, ""]]
  HasCheckout: !Not [!Equals [!Ref CheckoutDomain, ""]]
  LockApi: !Not [!Equals [!Ref ApiFunctionName, ""]]
  LockCheckout: !Not [!Equals [!Ref CheckoutFunctionName, ""]]
  HasImages: !Not [!Equals [!Ref ImagesDomain, ""]]
  LockImages: !Not [!Equals [!Ref ImagesFunctionName, ""]]
  LockAny: !Or [!Condition LockApi, !Condition LockCheckout, !Condition LockImages]
  Www: !Equals [!Ref IncludeWww, "true"]
  Dns: !Equals [!Ref ManageDns, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub updraft-site${NameSuffix}-${AWS::AccountId}
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      OwnershipControls: { Rules: [{ ObjectOwnership: BucketOwnerEnforced }] }
      BucketEncryption: { ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }] }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # ListBucket lets S3 answer 404 (not 403) for missing pages, so CloudFront can show error.html.
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: [s3:GetObject, s3:ListBucket]
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" }

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !If [Www, [!Sub "www.${DomainName}"], !Ref AWS::NoValue]
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId }
        - !If [Www, { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZoneId }, !Ref AWS::NoValue]

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub updraft-site${NameSuffix}-${AWS::AccountId}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront signs every request to the Lambda function URLs, which only accept signed requests
  # (AuthType AWS_IAM), so the API can't be called directly. POST bodies need an
  # x-amz-content-sha256 header; site/js/api.js adds it.
  ApiAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: LockAny
    Properties:
      OriginAccessControlConfig:
        Name: !Sub updraft-api${NameSuffix}-${AWS::AccountId}
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # Both permissions are needed for CloudFront to call a function URL with origin access control.
  ApiUrlFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockApi
    Properties:
      FunctionName: !Ref ApiFunctionName
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM
  ApiInvokeFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockApi
    Properties:
      FunctionName: !Ref ApiFunctionName
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
  CheckoutUrlFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockCheckout
    Properties:
      FunctionName: !Ref CheckoutFunctionName
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM
  CheckoutInvokeFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockCheckout
    Properties:
      FunctionName: !Ref CheckoutFunctionName
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  ImagesUrlFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockImages
    Properties:
      FunctionName: !Ref ImagesFunctionName
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
      FunctionUrlAuthType: AWS_IAM
  ImagesInvokeFromCloudFront:
    Type: AWS::Lambda::Permission
    Condition: LockImages
    Properties:
      FunctionName: !Ref ImagesFunctionName
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Resized shop photos never change for a given photo, width and format, so cache them for a year,
  # keyed on exactly those three query values (anything else in the URL is ignored).
  ImageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasImages
    Properties:
      CachePolicyConfig:
        Name: !Sub updraft-images${NameSuffix}
        MinTTL: 86400
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: whitelist, QueryStrings: [u, w, f] }
  # Share pages (/p/<piece>) follow the origin's cache time (5 minutes), so a sold piece's preview
  # catches up quickly.
  PieceCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Condition: HasApi
    Properties:
      CachePolicyConfig:
        Name: !Sub updraft-pieces${NameSuffix}
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig: { HeaderBehavior: none }
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub updraft-site${NameSuffix}-security-headers
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Override: true }
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          # Styles are inlined into each page, and Square's card form needs its own hosts.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self';
              img-src 'self' data: https://*.squarecdn.com https://items-images-production.s3.us-west-2.amazonaws.com https://items-images-sandbox.s3.us-west-2.amazonaws.com;
              script-src 'self' https://*.squarecdn.com https://js.squareup.com https://js.squareupsandbox.com;
              style-src 'self' 'unsafe-inline' https://*.squarecdn.com;
              font-src 'self' https://*.squarecdn.com https://d1g145x70srn7h.cloudfront.net;
              connect-src 'self' https://*.squareup.com https://*.squareupsandbox.com https://*.squarecdn.com https://o160250.ingest.sentry.io;
              frame-src https://*.squarecdn.com https://*.squareup.com https://*.squareupsandbox.com https://*.cardinalcommerce.com;
              base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub ${DomainName} static site
        Enabled: true
        Aliases: !If [Www, [!Ref DomainName, !Sub "www.${DomainName}"], [!Ref DomainName]]
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - !If
            - HasApi
            - Id: api
              DomainName: !Ref ApiDomain
              OriginAccessControlId: !If [LockApi, !GetAtt ApiAccessControl.Id, !Ref AWS::NoValue]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            - !Ref AWS::NoValue
          - !If
            - HasCheckout
            - Id: checkout
              DomainName: !Ref CheckoutDomain
              OriginAccessControlId: !If [LockCheckout, !GetAtt ApiAccessControl.Id, !Ref AWS::NoValue]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            - !Ref AWS::NoValue
          - !If
            - HasImages
            - Id: images
              DomainName: !Ref ImagesDomain
              OriginAccessControlId: !If [LockImages, !GetAtt ApiAccessControl.Id, !Ref AWS::NoValue]
              CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
            - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        # Order matters: CloudFront uses the first matching pattern, so /api/checkout and /api/img come before /api/*.
        CacheBehaviors:
          - !If
            - HasCheckout
            - PathPattern: /api/checkout
              TargetOriginId: checkout
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
          - !If
            - HasImages
            - PathPattern: /api/img
              TargetOriginId: images
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD]
              Compress: false # already compressed image formats
              CachePolicyId: !Ref ImageCachePolicy
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
          - !If
            - HasApi
            - PathPattern: /api/*
              TargetOriginId: api
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
          - !If
            - HasApi
            - PathPattern: /p/*
              TargetOriginId: api
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD]
              Compress: true
              CachePolicyId: !Ref PieceCachePolicy
              ResponseHeadersPolicyId: !Ref SecurityHeaders
            - !Ref AWS::NoValue
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /error.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /error.html, ErrorCachingMinTTL: 60 }

  # Staging only; production's records are managed by scripts/dns-cutover.mjs.
  AliasA:
    Type: AWS::Route53::RecordSet
    Condition: Dns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }
  AliasAAAA:
    Type: AWS::Route53::RecordSet
    Condition: Dns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: { DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2 }

Outputs:
  BucketName: { Value: !Ref SiteBucket }
  DistributionId: { Value: !Ref Distribution }
  DistributionDomain: { Value: !GetAtt Distribution.DomainName }
  CertificateArn: { Value: !Ref Certificate }
