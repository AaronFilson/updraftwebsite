<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Updraft Pottery Studio</title>
  <meta name="description" content="Order handmade pottery from Updraft Pottery Studio in Tacoma, WA.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{css}}">
  <script type="module" src="{{js}}"></script>
</head>
<body>
<!--header-->

  <main id="main" class="wrap">
    <section>
      <h1 class="page-title">Shop</h1>
      <div class="shop-layout">
        <div>
          <div id="products" class="grid" aria-live="polite"><p class="empty">Loading pieces…</p></div>
        </div>

        <aside class="panel" id="cart" aria-label="Cart and checkout">
          <h2 class="panel-title">Your cart</h2>
          <div id="cart-lines"></div>

          <form id="checkout" hidden novalidate>
            <div class="totals">
              <div><span>Subtotal</span><span id="t-sub"></span></div>
              <div id="t-ship-row" hidden><span>Shipping</span><span id="t-ship"></span></div>
              <small class="muted">Sales tax, if any, is added when you pay.</small>
            </div>

            <fieldset>
              <legend>Receive your order by</legend>
              <div class="radios">
                <label><input type="radio" name="fulfillment" value="pickup" checked> Local pickup (Tacoma)</label>
                <label><input type="radio" name="fulfillment" value="shipping"> Shipping (US)</label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Contact</legend>
              <input name="name" placeholder="Full name" autocomplete="name" required>
              <input name="email" type="email" placeholder="Email for receipt" autocomplete="email" required>
            </fieldset>

            <fieldset id="address" hidden>
              <legend>Shipping address</legend>
              <input name="line1" placeholder="Street address" autocomplete="address-line1">
              <input name="line2" placeholder="Apt, suite (optional)" autocomplete="address-line2">
              <input name="city" placeholder="City" autocomplete="address-level2">
              <input name="state" placeholder="State (e.g. WA)" maxlength="2" autocomplete="address-level1">
              <input name="postalCode" placeholder="ZIP" inputmode="numeric" autocomplete="postal-code">
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <div id="card-container"></div>
            </fieldset>

            <div id="status" role="status"></div>
            <button class="btn wide" id="pay" type="submit" disabled>Pay</button>
            <p class="muted small">Payments are processed securely by Square.</p>
          </form>
        </aside>
      </div>
    </section>
  </main>

<!--footer-->
</body>
</html>
