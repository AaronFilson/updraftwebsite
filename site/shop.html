<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Updraft Pottery Studio</title>
  <meta name="description" content="Order handmade pottery from Updraft Pottery Studio in Tacoma, WA.">
<!--meta-->
  {{css}}
  <noscript><style>.signup-form { display: none; }</style></noscript>
  <script type="module" src="{{js}}"></script>
</head>
<body>
<!--header-->

  <main id="main" class="wrap">
    <section>
      <h1 class="page-title">Shop</h1>
      <div class="shop-layout">
        <div>
          <div id="products" class="grid" aria-busy="true">
            <p class="empty">Loading pieces…</p>
            <noscript><p class="empty">The shop needs JavaScript turned on. You can still browse <a href="/#work">recent work</a> and <a href="/past-work.html">past work</a>.</p></noscript>
          </div>
        </div>

        <aside class="panel" id="cart" aria-label="Cart and checkout">
          <h2 class="panel-title" id="cart-title" tabindex="-1">Your cart</h2>
          <p id="announce" class="vh" aria-live="polite"></p>
          <div id="cart-lines"><p class="empty">Your cart is empty.</p></div>

          <form id="checkout" hidden novalidate>
            <div class="totals" aria-labelledby="totals-title">
              <span class="vh" id="totals-title">Order total</span>
              <div><span>Subtotal</span><span id="t-sub"></span></div>
              <div id="t-ship-row" hidden><span>Shipping</span><span id="t-ship"></span></div>
              <div><span>Sales tax</span><span id="t-tax">–</span></div>
              <div class="total-row"><span>Total</span><span id="t-total">–</span></div>
              <small class="muted" id="quote-status" role="status"></small>
            </div>

            <fieldset>
              <legend>Receive your order by</legend>
              <div class="radios">
                <label><input type="radio" name="fulfillment" value="pickup" checked> Local pickup (Tacoma)</label>
                <label><input type="radio" name="fulfillment" value="shipping"> Shipping (US)</label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Contact</legend>
              <label class="field">Full name <input name="name" autocomplete="name" required></label>
              <label class="field">Email (for your receipt) <input name="email" type="email" autocomplete="email" required></label>
              <label class="field">Phone (optional, for pickup or delivery questions) <input name="phone" type="tel" autocomplete="tel" inputmode="tel"></label>
            </fieldset>

            <fieldset>
              <legend>Billing address (US)</legend>
              <label class="field">Street address <input name="billLine1" autocomplete="billing address-line1" required></label>
              <label class="field">Apt, suite (optional) <input name="billLine2" autocomplete="billing address-line2"></label>
              <label class="field">City <input name="billCity" autocomplete="billing address-level2" required></label>
              <label class="field">State (2 letters, e.g. WA) <input name="billState" maxlength="2" autocomplete="billing address-level1" pattern="[A-Za-z]{2}" required></label>
              <label class="field">ZIP code <input name="billZip" inputmode="numeric" autocomplete="billing postal-code" pattern="[0-9]{5}(-[0-9]{4})?" required></label>
            </fieldset>

            <fieldset id="shipping" hidden>
              <legend>Shipping address (US)</legend>
              <label class="check"><input type="checkbox" name="shipSame" checked aria-controls="ship-fields"> Ship to my billing address</label>
              <div id="ship-fields" hidden>
                <label class="field">Recipient name <input name="shipName" autocomplete="shipping name" data-ship></label>
                <label class="field">Street address <input name="shipLine1" autocomplete="shipping address-line1" data-ship></label>
                <label class="field">Apt, suite (optional) <input name="shipLine2" autocomplete="shipping address-line2"></label>
                <label class="field">City <input name="shipCity" autocomplete="shipping address-level2" data-ship></label>
                <label class="field">State (2 letters, e.g. WA) <input name="shipState" maxlength="2" autocomplete="shipping address-level1" pattern="[A-Za-z]{2}" data-ship></label>
                <label class="field">ZIP code <input name="shipZip" inputmode="numeric" autocomplete="shipping postal-code" pattern="[0-9]{5}(-[0-9]{4})?" data-ship></label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <div id="card-container"></div>
            </fieldset>

            <div id="status" role="status"></div>
            <div id="error" role="alert"></div>
            <button class="btn wide" id="pay" type="submit" disabled>Pay</button>
            <p class="muted small">Payments are processed securely by Square.</p>
          </form>
        </aside>
      </div>
    </section>
  </main>

<!--footer-->
</body>
</html>
