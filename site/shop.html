<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Updraft Pottery Studio</title>
  <meta name="description" content="Order handmade pottery from Updraft Pottery Studio in Tacoma, WA.">
<!--meta-->
  {{css}}
  <noscript><style>.signup-form { display: none; }</style></noscript>
  <script type="module" src="{{js}}"></script>
</head>
<body>
<!--header-->

  <main id="main" class="wrap">
    <section>
      <h1 class="page-title">Shop</h1>
      <div class="shop-layout">
        <div>
          <div id="products" class="grid" aria-busy="true">
            <p class="empty">Loading pieces…</p>
            <noscript><p class="empty">The shop needs JavaScript turned on. You can still browse <a href="/#work">recent work</a> and <a href="/past-work.html">past work</a>.</p></noscript>
          </div>
        </div>

        <aside class="panel" id="cart" aria-label="Cart and checkout">
          <h2 class="panel-title" id="cart-title" tabindex="-1">Your cart</h2>
          <p id="announce" class="vh" aria-live="polite"></p>
          <div id="cart-lines"><p class="empty">Your cart is empty.</p></div>

          <form id="checkout" hidden novalidate>
            <div class="totals">
              <div><span>Subtotal</span><span id="t-sub"></span></div>
              <div id="t-ship-row" hidden><span>Shipping</span><span id="t-ship"></span></div>
              <small class="muted">Sales tax, if any, is added when you pay.</small>
            </div>

            <fieldset>
              <legend>Receive your order by</legend>
              <div class="radios">
                <label><input type="radio" name="fulfillment" value="pickup" checked> Local pickup (Tacoma)</label>
                <label><input type="radio" name="fulfillment" value="shipping"> Shipping (US)</label>
              </div>
            </fieldset>

            <fieldset>
              <legend>Contact</legend>
              <label class="field">Full name <input name="name" autocomplete="name" required></label>
              <label class="field">Email (for your receipt) <input name="email" type="email" autocomplete="email" required></label>
            </fieldset>

            <fieldset id="address" hidden>
              <legend>Shipping address</legend>
              <label class="field">Street address <input name="line1" autocomplete="address-line1" data-ship-required></label>
              <label class="field">Apt, suite (optional) <input name="line2" autocomplete="address-line2"></label>
              <label class="field">City <input name="city" autocomplete="address-level2" data-ship-required></label>
              <label class="field">State (2 letters, e.g. WA) <input name="state" maxlength="2" autocomplete="address-level1" pattern="[A-Za-z]{2}" data-ship-required></label>
              <label class="field">ZIP code <input name="postalCode" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}(-[0-9]{4})?" data-ship-required></label>
            </fieldset>

            <fieldset>
              <legend>Payment</legend>
              <div id="card-container"></div>
            </fieldset>

            <div id="status" role="status"></div>
            <div id="error" role="alert"></div>
            <button class="btn wide" id="pay" type="submit" disabled>Pay</button>
            <p class="muted small">Payments are processed securely by Square.</p>
          </form>
        </aside>
      </div>
    </section>
  </main>

<!--footer-->
</body>
</html>
